$kind: http-example
name: Model metadata and Cloudinary URLs were saved.
request:
  url: "{{baseUrl}}/models"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: formdata
    content:
      - type: file
        key: model
        src: ""
        description: (Required) GLB file, up to 50 MB.
      - type: text
        key: name
        value: string
        description: "(Required) "
      - type: text
        key: category
        value: avatar
        description: "(Required) "
      - type: file
        key: thumbnail
        src: ""
        description: Optional JPEG, PNG, or WebP image, up to 5 MB.
      - type: text
        key: description
        value: string
        description: ""
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "id": "4ef5a408-3c96-3f11-ad62-0fe7dce1bfbf",
          "name": "string",
          "category": "shirt",
          "modelUrl": "http://CioTyJiINGqotNqSywJOeAPkmnT.kiWMwkkofou1h.zk1",
          "fileSize": 6740,
          "createdAt": "1984-10-13T13:52:00.991Z",
          "description": "string",
          "thumbnailUrl": "https://NS.aoILZ8qwbWfCiawX6"
        }
      }
order: 1000
