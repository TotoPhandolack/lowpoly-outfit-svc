  url: "{{baseUrl}}/models/:id"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: b09845df-a3ad-cf37-22c7-8621514fa870
      disabled: false
